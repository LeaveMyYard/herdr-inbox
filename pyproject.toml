[project]
name = "herdr-inbox"
version = "0.5.0"
description = "Non-blocking operator question inbox for coding agents running in herdr"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "textual>=3.0",
]

[project.scripts]
inbox = "herdr_inbox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_inbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
