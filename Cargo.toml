# Rust workspace of herdr-inbox (plan: herdr-panorama docs/plans/rust-rewrite.md §2.2).
#
# During the migration it sits beside the Python package: `crates/` and
# `src/main.rs` do not collide with `src/herdr_inbox/`. The Python code is
# deleted at cutover (§5.3, P8).
#
# The shared kit (https://github.com/LeaveMyYard/herdr-agent-kit) is a git
# dependency pinned by tag (§2.1). Its line in [workspace.dependencies] stays one
# inline table on one line, so .github/workflows/kit-bump.yml can bump it.

[workspace]
members = ["crates/inbox-core"]
resolver = "3"

[workspace.package]
# The plugin's version: equal to pyproject.toml's until cutover (a release tag vX.Y.Z
# must match both; .github/workflows/release.yml, tests/test_manifests.py).
version = "0.10.6"
edition = "2024"
# MSRV, the same as herdr-agent-kit's. It equals the toolchain pinned in
# rust-toolchain.toml; bump both together.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/LeaveMyYard/herdr-inbox"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
inbox-core = { path = "crates/inbox-core" }
herdr-agent-kit = { git = "https://github.com/LeaveMyYard/herdr-agent-kit", tag = "v0.1.3" }
# `bundled`: SQLite is compiled in, so there is no system sqlite dependency (plan §4).
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `unbounded_depth`: a hook payload nested deeper than 128 levels (src/hook/payload/deep.rs).
# `preserve_order`: objects keep their keys in insertion order, as Python's dicts and
# json.dumps do (src/pyjson.rs writes the JSON Python reads back).
serde_json = { version = "1", features = ["unbounded_depth", "preserve_order"] }
# Python's `\w` and `str.isprintable` by Unicode general category (src/store/norm.rs).
unicode-general-category = "1.1.0"
tempfile = "3"

# The `herdr-inbox` binary: one binary, subcommands keep today's CLI names (§2.2).
# Its version is the workspace's: the plugin's (see [workspace.package]).
[package]
name = "herdr-inbox"
description = "Non-blocking operator question inbox for coding agents running in herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# What the subcommands share (the store, the Claude-side lookups); the binary
# is src/main.rs. Only the binary uses it: it is not a published library.
[lib]
name = "herdr_inbox"
path = "src/lib.rs"

[[bin]]
name = "herdr-inbox"
path = "src/main.rs"

[dependencies]
inbox-core.workspace = true
# `internal`: the inbox's own paths and formats (plugin-only, outside the kit's semver).
herdr-agent-kit = { workspace = true, features = ["internal"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-general-category.workspace = true

[dev-dependencies]
# FakeHerdr for the watcher's tests
herdr-agent-kit = { workspace = true, features = ["internal", "test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
