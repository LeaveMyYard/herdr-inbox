# Release flow (plan docs/plans/rust-rewrite.md §4 item 2, in herdr-panorama): main only ever
# names assets that already exist.
#
#   1. The release PR bumps Cargo.toml and pyproject.toml to X.Y.Z; the manifests still name
#      the previous release.
#   2. Tag vX.Y.Z on that main commit: this workflow builds the 4 targets from the tag and
#      publishes herdr-inbox-vX.Y.Z-<target>.tar.gz plus SHA256SUMS.
#   3. It then opens a PR that writes release.toml (tag + sha256 per target) and bumps the
#      manifests (tools/release_manifest.py). Its merge points installs at vX.Y.Z.
#
# A failed build leaves main naming the previous release, so installs keep working.
#
# On a pull request that touches this flow, the build and packaging run as a dry run (nothing
# is published) and step 3's tool runs against the dry run's SHA256SUMS on a scratch copy.
#
# Least privilege: `verify` and `build` run repo code with a read-only token that is not
# persisted; `publish` holds the write token and runs no repo code; `manifest-pr` runs only
# tools/release_manifest.py from the default branch.
#
# Secrets: RELEASE_BOT_TOKEN (optional; Contents and Pull requests: write on this repo). With
# GITHUB_TOKEN instead, GitHub starts no CI for the bot's PR: close and reopen it.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package-release.sh"
      - "tools/release_manifest.py"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches the versions and is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          py_v=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "$TAG" != "v$cargo_v" ] || [ "$TAG" != "v$py_v" ]; then
            echo "::error::tag $TAG must equal v<Cargo.toml version> (v$cargo_v) and v<pyproject version> (v$py_v)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: verify
    if: always() && (needs.verify.result == 'success' || github.event_name == 'pull_request')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }  # cross build on arm64
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install the pinned toolchain and the target
        run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        env:
          VERSION: ${{ needs.verify.outputs.version || '0.0.0-dryrun' }}
          RUN: ${{ matrix.run }}
        run: |
          set -euo pipefail
          tarball=$(sh scripts/package-release.sh "$TARGET" "$VERSION" dist)
          tar -tzf "$tarball" | LC_ALL=C sort | tr '\n' ' ' | grep -qx 'LICENSE herdr-inbox '
          if [ "$RUN" = true ]; then
            mkdir unpacked && tar -C unpacked -xzf "$tarball"
            unpacked/herdr-inbox | grep -q '^herdr-inbox '
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sums:
    name: SHA256SUMS
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum herdr-inbox-v*.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  dry-run-manifest:
    name: release.toml from the dry run
    needs: sums
    if: github.event_name == 'pull_request' && needs.sums.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Step 3's tool on a scratch copy
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/repo"
          mkdir -p "$scratch/.claude-plugin"
          cp herdr-plugin.toml "$scratch/"
          cp .claude-plugin/plugin.json .claude-plugin/marketplace.json "$scratch/.claude-plugin/"
          python3 tools/release_manifest.py v0.0.0-dryrun dist/SHA256SUMS "$scratch" && exit 1 || true  # not a release tag
          sed 's/-dryrun-/-/' dist/SHA256SUMS > "$RUNNER_TEMP/sums"
          python3 tools/release_manifest.py v0.0.0 "$RUNNER_TEMP/sums" "$scratch"
          cat "$scratch/release.toml"
          grep -c '^[a-z0-9_-]* = "[0-9a-f]\{64\}"$' "$scratch/release.toml" | grep -qx 4
          grep -qx 'version = "0.0.0"' "$scratch/herdr-plugin.toml"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["version"]=="0.0.0" and d["mcpServers"]["herdr-inbox"]["env"]["UV_PROJECT_ENVIRONMENT"].endswith("/venv-0.0.0")' "$scratch/.claude-plugin/plugin.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); v={p["name"]: p["version"] for p in d["plugins"]}; assert v["herdr-inbox"]=="0.0.0" and v["herdr-inbox-ui"]!="0.0.0", v' "$scratch/.claude-plugin/marketplace.json"
          head -n 3 "$RUNNER_TEMP/sums" > "$RUNNER_TEMP/short"
          if python3 tools/release_manifest.py v0.0.0 "$RUNNER_TEMP/short" "$scratch"; then exit 1; fi  # a missing target fails

  publish:
    name: publish the release
    needs: [verify, sums]
    if: github.event_name == 'push' && needs.sums.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes dist/*

  manifest-pr:
    name: open the release.toml PR
    needs: [verify, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read the published SHA256SUMS (from the release, not the build)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
      - name: Write release.toml and bump the manifests
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release_manifest.py "$TAG" "$RUNNER_TEMP/SHA256SUMS" .
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="release-manifest/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add release.toml herdr-plugin.toml .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "Point installs at $TAG (release.toml, manifests)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "Point installs at $TAG" \
            --body "Writes release.toml (the sha256 of each target's tarball, from the published SHA256SUMS of [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)) and bumps the plugin version in herdr-plugin.toml, plugin.json and marketplace.json. Until this merges, installs fetch the previous release. Opened by .github/workflows/release.yml."
