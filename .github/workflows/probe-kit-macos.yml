# TEMPORARY, dropped before review: the kit's transport test on real macOS,
# without and with the fix (kit v0.1.3 plus a patch).
name: probe-kit-macos
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: red then green
        shell: bash
        run: |
          git clone -q --depth 1 --branch v0.1.3 https://github.com/LeaveMyYard/herdr-agent-kit "$RUNNER_TEMP/kit"
          cd "$RUNNER_TEMP/kit"
          rustup toolchain install
          git apply "$GITHUB_WORKSPACE/.github/probe/kit-red.patch"
          set +e
          cargo test --locked --all-features --lib herdr_api::transport 2>&1 | tee "$RUNNER_TEMP/red.log" | tail -25
          red=${PIPESTATUS[0]}
          set -e
          git reset -q --hard
          git clean -qfd -e target
          git apply "$GITHUB_WORKSPACE/.github/probe/kit-fix.patch"
          set +e
          for i in 1 2 3 4 5; do cargo test --locked --all-features --lib herdr_api::transport 2>&1 | tail -7; green=${PIPESTATUS[0]}; [ "$green" = 0 ] || break; done
          cargo test --locked --all-features --test herdr_api 2>&1 | tail -4
          rest=${PIPESTATUS[0]}
          set -e
          echo "red=$red green=$green rest=$rest"
          grep -q "a_reply_from_a_peer_that_already_closed_is_read ... FAILED" "$RUNNER_TEMP/red.log" && test "$red" != 0 && test "$green" = 0 && test "$rest" = 0
