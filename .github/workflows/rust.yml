# Rust workspace CI (plan docs/plans/rust-rewrite.md §4 item 1, §7.4).
#
# The workflow always runs, and a `changes` job decides which jobs have work.
# Path filters live there, not in `on.paths`: a workflow skipped by `on.paths`
# never reports, so a required check on it would wait forever. The `rust ok`
# job at the end always reports and is the one to require: it is green when
# every job passed or was skipped, and red when any failed or was cancelled.
#
# Python CI stays in ci.yml and is not affected.

name: Rust

on:
  push:
    branches: [main]
  pull_request:  # any base: stacked PRs target feature branches

permissions:
  contents: read
  pull-requests: read  # paths-filter lists a PR's files through the API

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ledger: ${{ steps.filter.outputs.ledger }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'src/main.rs'
              - 'src/**/*.rs'
              - '.github/workflows/rust.yml'
            ledger:
              - 'tests/ledger/**'
              - 'tools/ledger_check.py'
              - '.github/workflows/rust.yml'

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (rust-version)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the MSRV toolchain
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  build:
    # The four release targets (§4 item 1). Static musl on Linux; each Linux
    # target builds natively on its own arch, so C dependencies need no cross
    # toolchain. When rusqlite arrives it must use the `bundled` feature (no
    # system sqlite): its C build then goes through musl-gcc (CC_* below) on
    # Linux and Apple clang (which targets both archs) on macOS.
    name: build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }  # cross from arm64
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install the pinned toolchain and the target
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          bin=target/${{ matrix.target }}/release/herdr-inbox
          file "$bin"
          case "${{ matrix.target }}" in
            *-linux-musl) file "$bin" | grep -Eq 'static(-pie)? linked' ;;
            x86_64-apple-darwin) file "$bin" | grep -q 'x86_64' ;;
            aarch64-apple-darwin) file "$bin" | grep -q 'arm64' ;;
          esac
          if [ "${{ matrix.run }}" = true ]; then "$bin" | grep -q '^herdr-inbox '; fi

  ledger:
    name: test ledger
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ledger_check.py

  rust-ok:
    name: rust ok
    needs: [changes, check, msrv, build, ledger]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
