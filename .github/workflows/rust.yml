# Rust workspace CI (plan docs/plans/rust-rewrite.md §4 item 1, §7.4).
#
# The workflow always runs, and a `changes` job decides which jobs have work.
# Path filters live there, not in `on.paths`: a workflow skipped by `on.paths`
# never reports, so a required check on it would wait forever. The `rust ok`
# job at the end always reports and is the one to require: it is green when
# every job passed or was skipped, and red when any failed or was cancelled.
#
# Python CI stays in ci.yml and is not affected. The MSRV (rust-version) equals
# the toolchain pinned in rust-toolchain.toml and both are bumped together, as in
# herdr-agent-kit, so `check` covers the MSRV.

name: Rust

on:
  push:
    branches: [main]
  pull_request:  # any base: stacked PRs target feature branches

permissions:
  contents: read
  pull-requests: read  # paths-filter lists a PR's files through the API

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  BIN: herdr-inbox  # the plugin's binary; the only line that differs between the plugin repos

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ledger: ${{ steps.filter.outputs.ledger }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'src/main.rs'
              - 'src/**/*.rs'
              - 'tests/**/*.rs'
              - 'tests/fixtures/schema.json'  # compiled in (src/store/readiness.rs)
              - '.github/workflows/rust.yml'
              - '.github/scripts/structure-check.py'
              - '.github/structure-allowlist.txt'
            ledger:
              - 'tests/**'
              - 'src/herdr_*/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tools/ledger_check.py'
              - '.github/workflows/rust.yml'

  check:
    # On macOS this job also builds both darwin release targets, so a run holds
    # one macOS runner (the account's macOS concurrency is shared with ci.yml).
    name: fmt, clippy, test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, targets: "" }
          - { os: macos-latest, targets: "aarch64-apple-darwin x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build and check the darwin release targets
        if: matrix.targets != ''
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            rustup target add "$target"
            cargo build --release --locked --target "$target"
            bin="target/$target/release/$BIN"
            file "$bin"
            case "$target" in
              x86_64-*) file "$bin" | grep -q 'x86_64' ;;
              aarch64-*)
                file "$bin" | grep -q 'arm64'
                "$bin" | grep -q "^$BIN "  # macos-latest is arm64; x86_64 is a cross build
                ;;
            esac
          done

  structure:
    # COMMON.md "Code structure": <= 300 non-test lines per Rust source file and
    # no inline test modules or test functions (tests live in separate files);
    # exceptions only in .github/structure-allowlist.txt, which may only shrink.
    name: structure
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/structure-check.py --self-test
      - name: Structure check (on a PR, the allowlist may not gain an entry over the base branch)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 .github/scripts/structure-check.py --base FETCH_HEAD
          else
            python3 .github/scripts/structure-check.py
          fi

  build:
    # The Linux release targets (§4 item 1; darwin builds run in `check`).
    # Static musl, each built natively on its own arch, so C dependencies need
    # no cross toolchain. When rusqlite arrives it must use the `bundled`
    # feature (no system sqlite): its C build then goes through musl-gcc (CC_*
    # below) on Linux and Apple clang (which targets both archs) on macOS.
    name: build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install the pinned toolchain and the target
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/$BIN"
          file "$bin"
          # x86_64 links static-pie; aarch64 musl links a static non-PIE binary.
          file "$bin" | grep -Eq 'static-pie linked|statically linked'
          "$bin" | grep -q "^$BIN "

  ledger:
    # The ledger must list exactly the tests pytest collects: a Python PR that
    # adds or renames a test fails here until its ledger row is added. The
    # collection runs with every HERDR_* variable unset and scratch state.
    name: test ledger
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Collect the Python tests
        run: |
          set -euo pipefail
          for v in $(env | sed -n 's/^\(HERDR_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$v"; done
          scratch="$RUNNER_TEMP/ledger"
          mkdir -p "$scratch/state"
          export HERDR_INBOX_DB="$scratch/inbox.db" XDG_STATE_HOME="$scratch/state"
          uv run pytest --collect-only -q -p no:cacheprovider > "$scratch/collected.txt"
      - run: python3 tools/ledger_check.py --collected "$RUNNER_TEMP/ledger/collected.txt"

  rust-ok:
    name: rust ok
    needs: [changes, check, structure, build, ledger]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
